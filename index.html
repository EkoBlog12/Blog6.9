<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הכספת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110D;
    --panel:#1E1A14;
    --panel-line:#332C22;
    --brass:#C6963F;
    --brass-dim:#8C6B33;
    --text:#F1EAD9;
    --text-dim:#A89A82;
    --green:#3F7A57;
    --yellow:#C98A2E;
    --purple:#7C5FA8;
    --absent:#2A251E;
    --absent-line:#3A332A;
    --error:#B24A3C;
    --radius:6px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #221C13 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    font-family:'Heebo', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  @media (max-width: 480px){
    body{ padding:32px 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .eyebrow{
    color:var(--brass);
    font-size:14px;
    letter-spacing:0.02em;
    margin-bottom:10px;
  }

  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(44px, 9vw, 68px);
    margin:0 0 10px;
    color:var(--text);
    letter-spacing:0.01em;
  }

  .sub{
    color:var(--text-dim);
    font-size:18px;
    max-width:480px;
    text-align:center;
    line-height:1.65;
    margin-bottom:40px;
  }

  .legend{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:34px;
    font-size:14px;
    color:var(--text-dim);
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px; height:14px; border-radius:3px; display:inline-block;}
  .swatch.g{background:var(--green);}
  .swatch.y{background:var(--yellow);}
  .swatch.p{background:var(--purple);}

  #board{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
    width:100%;
    max-width:760px;
    overflow-x:auto;
    padding-bottom:2px;
  }

  .row{
    display:flex;
    justify-content:center;
    gap:18px;
  }

  .word-group{
    display:flex;
    gap:3px;
  }

  .tile{
    width:28px;
    height:36px;
    border:2px solid var(--absent-line);
    border-radius:var(--radius);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--text);
    position:relative;
  }

  @media (min-width: 520px){
    .row{ gap:40px; }
    .word-group{ gap:8px; }
    .tile{ width:52px; height:60px; font-size:24px; }
  }

  .tile.active-cell{
    border-color:var(--brass);
  }

  .tile.green{ background:var(--green); border-color:var(--green); color:#fff;}
  .tile.yellow{ background:var(--yellow); border-color:var(--yellow); color:#241a05;}
  .tile.purple{ background:var(--purple); border-color:var(--purple); color:#fff;}
  .tile.absent{ background:var(--absent); border-color:var(--absent-line); color:var(--text-dim);}

  .tile .mark{
    position:absolute;
    bottom:3px;
    left:5px;
    font-size:9px;
    opacity:0.75;
  }

  input.tile{
    -webkit-appearance:none;
    appearance:none;
    padding:0;
    outline:none;
    text-align:center;
    caret-color:var(--brass);
  }
  input.tile:focus{
    border-color:var(--brass);
  }

  #check-btn{
    margin-top:10px;
    margin-bottom:28px;
  }
  #check-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  #attempts{
    color:var(--text-dim);
    font-size:13px;
    margin-top:-10px;
    margin-bottom:16px;
  }

  /* Vault */
  #vault-stage{
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:8px;
  }

  .vault-wrap{
    position:relative;
    width:260px;
    height:260px;
    margin-bottom:34px;
    perspective:1000px;
  }

  .vault-interior{
    position:absolute;
    inset:0;
    border-radius:50%;
    background: var(--bg);
    box-shadow: inset 0 0 26px rgba(0,0,0,0.8);
  }

  .vault-door{
    position:absolute;
    inset:0;
    transform-origin: 0% 50%;
    transform-style:preserve-3d;
    transition: transform 0.5s cubic-bezier(.22,1,.36,1), filter 0.5s ease;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
  }

  .vault-door.open{
    transform: rotateY(-118deg);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
  }

  #wheel-group{
    transform-origin:100px 100px;
    transition: transform 0.5s cubic-bezier(.45,0,.2,1);
  }
  #wheel-group.spin{
    transform: rotate(360deg);
  }

  .code-inputs{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }

  .code-inputs input{
    width:54px;
    height:64px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:28px;
    font-weight:700;
    color:var(--text);
    background:var(--panel);
    border:2px solid var(--panel-line);
    border-radius:var(--radius);
    direction:ltr;
  }
  .code-inputs input:focus{
    outline:none;
    border-color:var(--brass);
  }

  .code-inputs.shake{
    animation: shake 0.4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  button{
    font-family:'Heebo', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 32px;
    border-radius:var(--radius);
    border:none;
    background:var(--brass);
    color:#221806;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button:hover{ background:#d9ab5c; }
  button:active{ transform:scale(0.97); }

  #vault-error{
    color:var(--error);
    font-size:13px;
    margin-top:12px;
    min-height:16px;
  }

  #success{
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:8px;
    animation: fadein 0.6s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  #success h2{
    font-family:'Frank Ruhl Libre', serif;
    font-size:32px;
    color:var(--brass);
    margin:0 0 8px;
  }
  #success p{
    color:var(--text-dim);
    font-size:14px;
  }

  #clue-stage{
    display:none;
    flex-direction:column;
    align-items:center;
    max-width:480px;
    margin-bottom:12px;
  }

  #clue-text{
    font-family:'Frank Ruhl Libre', serif;
    font-size:clamp(20px, 3.2vw, 28px);
    color:var(--text);
    text-align:center;
    line-height:1.7;
    margin:0 0 30px;
  }

  #found-btn{
    font-size:17px;
    padding:15px 36px;
  }

</style>
</head>
<body>

  <div class="eyebrow" id="eyebrow">שלב 1</div>
  <h1 id="site-title">הכספת</h1>
  <p class="sub" id="subtitle">מצאו את הביטוי הנסתר. כל אות תיצבע לפי מיקומה — נסו כמה פעמים שצריך, אין הגבלה.</p>

  <div class="legend" id="legend">
    <span><span class="swatch g"></span> במקום הנכון</span>
    <span><span class="swatch y"></span> באותה מילה, מקום אחר</span>
    <span><span class="swatch p"></span> במילה האחרת</span>
  </div>

  <div id="puzzle-stage">
    <div id="board"></div>
    <div id="attempts"></div>
    <button id="check-btn">בדקו</button>
  </div>

  <div id="clue-stage">
    <p id="clue-text">לכו לעמוד ה-2 וחפשו את הקוד בין השורות.</p>
    <button id="found-btn">מצאתי</button>
  </div>

  <div id="vault-stage">
    <div class="vault-wrap">
      <div class="vault-interior"></div>
      <div class="vault-door" id="vault-door">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <defs>
            <radialGradient id="doorGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#4a3d26"/>
              <stop offset="55%" stop-color="#221b10"/>
              <stop offset="100%" stop-color="#100c07"/>
            </radialGradient>
            <radialGradient id="hubGrad" cx="38%" cy="32%" r="70%">
              <stop offset="0%" stop-color="#efd08c"/>
              <stop offset="55%" stop-color="#b8873b"/>
              <stop offset="100%" stop-color="#7a5a28"/>
            </radialGradient>
          </defs>

          <circle cx="100" cy="100" r="96" fill="url(#doorGrad)" stroke="#0a0704" stroke-width="4"/>
          <circle cx="100" cy="100" r="96" fill="none" stroke="#5a4a30" stroke-width="1" opacity="0.5"/>

          <g fill="#5a4a30" stroke="#241d10" stroke-width="1">
            <circle cx="182" cy="100" r="4"/>
            <circle cx="171" cy="141" r="4"/>
            <circle cx="141" cy="171" r="4"/>
            <circle cx="100" cy="182" r="4"/>
            <circle cx="59" cy="171" r="4"/>
            <circle cx="29" cy="141" r="4"/>
            <circle cx="18" cy="100" r="4"/>
            <circle cx="29" cy="59" r="4"/>
            <circle cx="59" cy="29" r="4"/>
            <circle cx="100" cy="18" r="4"/>
            <circle cx="141" cy="29" r="4"/>
            <circle cx="171" cy="59" r="4"/>
          </g>

          <g id="wheel-group">
            <g stroke="#8a6a34" stroke-width="10" stroke-linecap="round">
              <line x1="100" y1="26" x2="100" y2="60"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(45 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(90 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(135 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(180 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(225 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(270 100 100)"/>
              <line x1="100" y1="26" x2="100" y2="60" transform="rotate(315 100 100)"/>
            </g>
            <circle cx="100" cy="100" r="27" fill="url(#hubGrad)" stroke="#4a3616" stroke-width="3"/>
            <circle cx="100" cy="100" r="9" fill="#2c2313"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="code-inputs" id="code-inputs" dir="ltr">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <button id="open-btn">פתחו את הכספת</button>
    <div id="vault-error"></div>
  </div>

  <div id="success">
    <h2>הצלחתם 🔓</h2>
    <p>הכספת נפתחה.</p>
  </div>

<script>
